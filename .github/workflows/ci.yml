name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: 评测管线与题库验证（Java-only）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 环境检查
        run: |
          node --version
          java -version 2>&1 | head -1
          javac -version 2>&1 | head -1

      - name: 语法检查
        run: |
          for f in cli/hot100.js judge/*.js judge/gen/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: 数据完整性检查（Java-only）
        run: |
          node -e "
            const p = require('./data/problems.json');
            const t = require('./data/tests.json');
            const s = require('./data/solutions.json');
            const badP = p.filter(x => !x.core || x.acm || !x.explain || x.core.templates);
            const badT = p.filter(x => !t[x.id] || !t[x.id].core || t[x.id].acm || t[x.id].core.length < 3);
            const badS = p.filter(x => !s[x.id] || !s[x.id].java || !s[x.id].java.core || s[x.id].python3 || s[x.id].cpp);
            if (p.length !== 100 || badP.length || badT.length || badS.length) {
              console.error('数据不完整', p.length, badP.map(x=>x.id), badT.map(x=>x.id), badS.map(x=>x.id));
              process.exit(1);
            }
            console.log('✅ 100 题数据完整（Java-only，core 用例 + Java 参考题解）');
          "

      - name: Java 驱动 + 100 份参考题解 + 官方签名
        run: node scripts/verify-java.js

      - name: 驱动边界测试（List/节点语义/顺序无关）
        run: node scripts/test-judge.js

      - name: 扩展用例生成回归（Java oracle）
        run: node scripts/test-extend.js

      - name: 全量扩展用例验证（100 题）
        run: node scripts/verify-extend-all.js
